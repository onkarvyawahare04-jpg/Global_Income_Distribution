{% extends "base.html" %}
{% block title %}Feedback - GIDA Dashboard{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8" data-aos="fade-up">
            <div class="glass-card p-5">
                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="stat-icon blue mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                        <i class="bi bi-chat-square-heart-fill"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Share Your Feedback</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        We value your input to help improve the Global Income Distribution Dashboard.
                    </p>
                </div>

                <!-- Form -->
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label-custom">
                            <i class="bi bi-person me-1"></i>Full Name
                        </label>
                        <input type="text" name="name" class="form-control form-control-glass"
                            placeholder="Enter your name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">
                            <i class="bi bi-envelope me-1"></i>Email Address
                        </label>
                        <input type="email" name="email" class="form-control form-control-glass"
                            placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">
                            <i class="bi bi-star me-1"></i>Your Rating
                        </label>
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5" checked /><label for="star5"
                                title="5 stars"></label>
                            <input type="radio" id="star4" name="rating" value="4" /><label for="star4"
                                title="4 stars"></label>
                            <input type="radio" id="star3" name="rating" value="3" /><label for="star3"
                                title="3 stars"></label>
                            <input type="radio" id="star2" name="rating" value="2" /><label for="star2"
                                title="2 stars"></label>
                            <input type="radio" id="star1" name="rating" value="1" /><label for="star1"
                                title="1 star"></label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label-custom">
                            <i class="bi bi-pencil-square me-1"></i>Your Message
                        </label>
                        <textarea name="message" class="form-control form-control-glass" rows="5"
                            placeholder="Tell us what you think..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 py-3">
                        <i class="bi bi-send me-2"></i>Submit Feedback
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
